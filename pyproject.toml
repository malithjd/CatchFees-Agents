[project]
name = "catchfees-agents"
version = "0.1.0"
description = "Agentic system for catching hidden fees in car purchase agreements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "google-adk>=2.3.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "sse-starlette>=3.4.5",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catchfees"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

